name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset-platform }} app
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset-platform: windows
            builder-args: --win nsis portable --x64 --publish never
            forge-platform: win32
            package-dir: QuestionExtractor-win32-x64
            offline-assets: |
              out/builder/*.exe
            zip-assets: |
              release/*.zip
          - os: macos-13
            asset-platform: macos
            forge-platform: darwin
            package-dir: QuestionExtractor-darwin-x64
            offline-assets: |
              out/make/*.dmg
            zip-assets: |
              out/make/zip/darwin/x64/*.zip
          - os: ubuntu-latest
            asset-platform: linux
            builder-args: --linux AppImage --x64 --publish never
            forge-platform: linux
            package-dir: QuestionExtractor-linux-x64
            offline-assets: |
              out/builder/*.AppImage
            zip-assets: |
              release/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build offline package
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builder-args }}

      - name: Build macOS offline and zip packages
        if: runner.os == 'macOS'
        run: npx electron-forge make --platform=darwin --arch=x64

      - name: Package application for zip
        if: runner.os != 'macOS'
        run: npx electron-forge package --platform=${{ matrix.forge-platform }} --arch=x64

      - name: Archive zip package
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release
          safe_ref_name="$(printf '%s' '${{ github.ref_name }}' | sed 's/[^A-Za-z0-9._-]/-/g')"
          package_dir="out/${{ matrix.package-dir }}"

          if [ ! -d "$package_dir" ]; then
            echo "Package directory was not found: $package_dir" >&2
            exit 1
          fi

          (
            cd out
            zip -qry "../release/question-extractor-${safe_ref_name}-${{ matrix.asset-platform }}-x64.zip" "${{ matrix.package-dir }}"
          )

      - name: Archive zip package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $safeRefName = "${{ github.ref_name }}" -replace "[^A-Za-z0-9._-]", "-"
          $packageDir = "out\${{ matrix.package-dir }}"

          if (-not (Test-Path $packageDir)) {
            throw "Package directory was not found: $packageDir"
          }

          Compress-Archive -Path "$packageDir\*" -DestinationPath "release\question-extractor-$safeRefName-${{ matrix.asset-platform }}-x64.zip" -Force

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v4
        with:
          name: question-extractor-${{ matrix.asset-platform }}-offline
          path: ${{ matrix.offline-assets }}
          if-no-files-found: error

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: question-extractor-${{ matrix.asset-platform }}-zip
          path: ${{ matrix.zip-assets }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
