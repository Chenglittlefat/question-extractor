name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package application
        run: npm run package

      - name: Archive Windows package
        shell: pwsh
        run: |
          $packageDir = Get-ChildItem -Path out -Directory -Filter "QuestionExtractor-win32-x64" | Select-Object -First 1
          if (-not $packageDir) {
            throw "Windows package directory was not found under out/."
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $safeRefName = "${{ github.ref_name }}" -replace "[^A-Za-z0-9._-]", "-"
          Compress-Archive -Path "$($packageDir.FullName)\*" -DestinationPath "release\question-extractor-$safeRefName-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: question-extractor-windows
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
